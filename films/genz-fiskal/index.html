<!doctype html>
<html><head><meta charset="utf-8"><title>Warta Kilat Nusantara</title>
<style>
@font-face{font-family:Limelight;src:url(fonts/Limelight-Regular.ttf)}
@font-face{font-family:Oswald;src:url(fonts/Oswald.ttf);font-weight:200 700}
@font-face{font-family:"Noto Sans";src:url(fonts/NotoSans.ttf);font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, hash, vnoise, TAU } from '/core/lib.js';
// "Warta Kilat Nusantara": a 1920s-style sound newsreel on 2025–26 Indonesian labour and budget data.
const W = 1920, H = 1080, GX = 220, GW = 1480, GH = 1080, FPS = 24;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const PIC = mk(GW, GH), P = PIC.getContext('2d'), TMP = mk(GW, GH), T2 = TMP.getContext('2d'), FROM = mk(GW, GH), F1 = FROM.getContext('2d'), AUX = mk(GW, GH), AX = AUX.getContext('2d');
const TL = await (await fetch('timeline.json')).json();
const MAP = await (await fetch('assets/java.json')).json();
const HIT = TL.hits, SEC = Object.fromEntries(TL.secs.map(s => [s.id, s])), BEAT = TL.beat, BAR = TL.bar;
const NOSUB = new URLSearchParams(location.search).has('nosub');
window.DUR = TL.dur;

const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.error('missing ' + src); r(null); }; i.src = src; });
const A = {};
await Promise.all(['ojol_cnbc', 'pkl_rujak', 'ojol_liputan6', 'pekerja_duduk_detik', 'pabrik_garmen_antara', 'sritex_buruh_gedung', 'sritex_buruh_menangis', 'demo_buruh_pailit']
  .map(async n => A[n] = await img(`assets/foto/${n}.jpg`)));
const CL = {};
await Promise.all(Object.entries(TL.clips).map(async ([k, c]) => {
  const n = Math.floor(c.dur * FPS) - 1;
  CL[k] = (await Promise.all([...Array(n).keys()].map(i => img(`assets/${k}/${String(i).padStart(3, '0')}.jpg`)))).filter(Boolean);
}));
for (const f of ['120px Limelight', '700 40px Oswald', '600 40px "Noto Sans"', 'italic 600 38px "Noto Sans"', '400 18px "Noto Sans"']) await document.fonts.load(f, 'ABC abc 0123');

// ---------- helpers ----------
const frameOf = t => Math.floor(t * FPS + 1e-6);
const clipFrame = (k, t, t0) => { const a = CL[k]; return a[clamp(frameOf(Math.max(0, t - t0)), 0, a.length - 1)]; };
const cover = (im, w = GW, h = GH) => Math.max(w / im.width, h / im.height);
function footage(c, k, t, t0, push = [1, 1.05], fx = .5, fy = .5) {
  const im = clipFrame(k, t, t0), s = cover(im) * lerp(push[0], push[1], seg(t, t0, t0 + CL[k].length / FPS));
  c.fillStyle = '#000'; c.fillRect(0, 0, GW, GH);
  const w = im.width * s, h = im.height * s; c.drawImage(im, clamp(GW / 2 - fx * w, GW - w, 0), clamp(GH / 2 - fy * h, GH - h, 0), w, h);
}
function pencil(c, pts, u, wid = 7, alpha = .92) {
  if (u <= 0 || pts.length < 2) return;
  const n = Math.max(2, Math.floor(pts.length * clamp(u)));
  for (const [dx, dy, a, lw] of [[0, 0, alpha, wid], [1.6, -1.2, alpha * .45, wid * .55]]) {
    c.save(); c.strokeStyle = `rgba(250,248,240,${a})`; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
    for (let i = 0; i < n; i++) { const [x, y] = pts[i], j = (hash(i * 1.7 + x * .01) - .5) * 1.6; i ? c.lineTo(x + dx + j, y + dy + j) : c.moveTo(x + dx, y + dy); }
    c.stroke(); c.restore();
  }
}
const ring = (cx, cy, rx, ry, rot = 0, turns = 1.12) => [...Array(64).keys()].map(i => { const a = -2.2 + i / 63 * TAU * turns, r = 1 + .05 * Math.sin(i * .7); return [cx + Math.cos(a + rot) * rx * r, cy + Math.sin(a + rot) * ry * r]; });
const lineP = (x0, y0, x1, y1, n = 24) => [...Array(n).keys()].map(i => { const u = i / (n - 1); return [lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(u * 9) * 2]; });
function pencilDark(c, pts, u, wid = 4) {
  if (u <= 0) return; const n = Math.max(2, Math.floor(pts.length * u));
  c.save(); c.strokeStyle = 'rgba(20,18,16,.85)'; c.lineWidth = wid; c.lineCap = 'round';
  for (const off of [0, 2.4]) { c.beginPath(); for (let i = 0; i < n; i++) { const [x, y] = pts[i]; i ? c.lineTo(x, y + off + Math.sin(i * 1.3) * .6) : c.moveTo(x, y + off); } c.stroke(); }
  c.restore();
}
const jolt = (t, T, amp = 16) => t > T ? Math.exp(-(t - T) * 14) * Math.sin((t - T) * 70) * amp : 0;
function bgDesk(c) { const g = c.createRadialGradient(GW / 2, GH * .45, 100, GW / 2, GH / 2, 1000); g.addColorStop(0, '#5b5751'); g.addColorStop(1, '#151413'); c.fillStyle = g; c.fillRect(0, 0, GW, GH); }
function silverText(c, txt, x, y, size, font = 'Limelight', align = 'center', ls = '0px') {
  c.font = `${size}px ${font}`; c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = ls;
  c.lineJoin = 'round'; c.lineWidth = size * .12; c.strokeStyle = '#0c0b0a'; c.strokeText(txt, x, y);
  const g = c.createLinearGradient(0, y - size * .5, 0, y + size * .5);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.48, '#d9d4ca'); g.addColorStop(.52, '#9e978a'); g.addColorStop(1, '#efebe2');
  c.fillStyle = g; c.fillText(txt, x, y); c.textBaseline = 'alphabetic';
}
function paperNoise(c, w, h, seed, amt = .05) { for (let i = 0; i < 2600; i++) { const s = seed + i * 1.37; c.fillStyle = hash(s) > .5 ? `rgba(0,0,0,${amt})` : `rgba(255,255,255,${amt})`; c.fillRect(hash(s + 1) * w, hash(s + 2) * h, 1 + hash(s + 3) * 3, 1 + hash(s + 4) * 2); } }
// something arrives as news: lands with a 3 % bounce and a jolt (u = 0..1 over the drop)
function slamIn(c, t, T, draw, dur = .16) {
  const u = eo(seg(t, T - dur, T)); if (u <= 0) return;
  c.save(); c.globalAlpha = clamp(u * 3); c.translate(0, jolt(t, T, 12)); const s = lerp(1.35, 1, u) * (1 + Math.exp(-Math.max(0, t - T) * 18) * .03);
  c.translate(GW / 2, GH / 2); c.scale(s, s); c.translate(-GW / 2, -GH / 2); draw(c); c.restore();
}
function print(c, im, cx, cy, w, rot, border = 22) {   // a photograph lying on the desk
  if (!im) return; const s = w / im.width, h = im.height * s;
  c.save(); c.translate(cx, cy); c.rotate(rot); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 36; c.shadowOffsetY = 14;
  c.fillStyle = '#e6e0d3'; c.fillRect(-w / 2 - border, -h / 2 - border, w + 2 * border, h + 2 * border); c.shadowColor = 'transparent';
  c.drawImage(im, -w / 2, -h / 2, w, h); c.restore();
  return { cx, cy, w, h, rot };
}
function stamp(c, txt, cx, cy, rot, u, size = 54, w = null) {   // a rubber stamp, pressed on the beat
  if (u <= 0) return; c.save(); c.translate(cx, cy); c.rotate(rot); const s = lerp(1.5, 1, eo(u)); c.scale(s, s); c.globalAlpha = clamp(u * 3) * .9;
  c.font = `700 ${size}px Oswald`; c.letterSpacing = '8px'; const tw = w || c.measureText(txt).width + 70, th = size * 2.1;
  c.strokeStyle = 'rgba(20,18,15,.9)'; c.lineWidth = 6; c.strokeRect(-tw / 2, -th / 2, tw, th); c.lineWidth = 2; c.strokeRect(-tw / 2 + 12, -th / 2 + 12, tw - 24, th - 24);
  c.fillStyle = 'rgba(20,18,15,.92)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 4, 2); c.restore();
}
function stampLight(c, txt, cx, cy, rot, u, size = 50) {   // the same stamp on a dark ground
  if (u <= 0) return; c.save(); c.translate(cx, cy); c.rotate(rot); c.scale(lerp(1.5, 1, eo(u)), lerp(1.5, 1, eo(u))); c.globalAlpha = clamp(u * 3);
  c.font = `700 ${size}px Oswald`; c.letterSpacing = '8px'; const tw = c.measureText(txt).width + 70, th = size * 2.1;
  c.fillStyle = 'rgba(14,13,11,.85)'; c.fillRect(-tw / 2, -th / 2, tw, th);
  c.strokeStyle = '#efe9dc'; c.lineWidth = 5; c.strokeRect(-tw / 2, -th / 2, tw, th); c.lineWidth = 2; c.strokeRect(-tw / 2 + 12, -th / 2 + 12, tw - 24, th - 24);
  c.fillStyle = '#efe9dc'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 4, 2); c.restore();
}

// ---------- ident ----------
function globe(c, cx, cy, R, rot, alpha = 1) {
  c.save(); c.globalAlpha = alpha; const g = c.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R);
  g.addColorStop(0, '#f4f1ea'); g.addColorStop(.55, '#a9a49a'); g.addColorStop(1, '#34312c'); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  const tilt = .38, ct = Math.cos(tilt), st = Math.sin(tilt);
  const P3 = (lat, lon) => { const x = Math.cos(lat) * Math.sin(lon + rot), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon + rot); return [cx + R * x, cy - R * (y * ct - z * st), y * st + z * ct]; };
  c.strokeStyle = 'rgba(20,18,15,.75)'; c.lineWidth = Math.max(1.2, R * .012);
  const line = pts => { c.beginPath(); let on = false; for (const p of pts) { if (p[2] > 0) { on ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); on = true; } else on = false; } c.stroke(); };
  for (let k = 0; k < 12; k++) { const pts = []; for (let a = -90; a <= 90; a += 4) pts.push(P3(a * Math.PI / 180, k * TAU / 12)); line(pts); }
  for (let la = -60; la <= 60; la += 30) { const pts = []; for (let a = 0; a <= 360; a += 4) pts.push(P3(la * Math.PI / 180, a * Math.PI / 180)); line(pts); }
  c.lineWidth = Math.max(2, R * .025); c.strokeStyle = 'rgba(10,9,8,.9)'; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke(); c.restore();
}
function sunburst(c, cx, cy, rot, a) { c.save(); c.globalAlpha = a; for (let i = 0; i < 36; i++) { const a0 = rot + i * TAU / 36; c.fillStyle = i % 2 ? '#2a2723' : '#1b1916'; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 1600, a0, a0 + TAU / 72); c.closePath(); c.fill(); } c.restore(); }
function beams(c, t, on, base = 0) {
  if (on <= 0) return; c.save(); c.globalCompositeOperation = 'lighter';
  for (const side of [-1, 1]) {
    const ox = GW / 2 + side * 640, oy = GH + 40, ang = -Math.PI / 2 - side * (.42 + .22 * Math.sin(t * 1.9 + (side > 0 ? 1.1 : 0)) + base), L = 1500, sp = .085;
    const g = c.createLinearGradient(ox, oy, ox + Math.cos(ang) * L, oy + Math.sin(ang) * L);
    g.addColorStop(0, `rgba(255,252,240,${.55 * on})`); g.addColorStop(.7, `rgba(255,250,235,${.16 * on})`); g.addColorStop(1, 'rgba(255,250,235,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + Math.cos(ang - sp) * L, oy + Math.sin(ang - sp) * L); c.lineTo(ox + Math.cos(ang + sp) * L, oy + Math.sin(ang + sp) * L); c.closePath(); c.fill();
  }
  c.restore();
}
function nameplate(c, t, t0, y) {
  const u = seg(t, t0, t0 + .5); if (u <= 0) return;
  c.save(); c.translate(GW / 2, y); const s = lerp(2.4, 1, back(u, 1.3)); c.scale(s, s); c.globalAlpha = clamp(u * 3); silverText(c, 'WARTA KILAT', 0, 0, 118); c.restore();
  const v = seg(t, t0 + .35, t0 + .65); if (v > 0) { c.save(); c.globalAlpha = v; silverText(c, 'NUSANTARA', GW / 2 + 9, y + 104, 58, 'Limelight', 'center', '18px'); c.restore(); }
}
function sceneLogo(c, t) {
  c.fillStyle = '#121110'; c.fillRect(0, 0, GW, GH);
  const T = HIT.beams_on, on = t < T ? 0 : clamp(1 - .6 * Math.exp(-(t - T) * 9)), flash = t >= T ? Math.exp(-(t - T) * 7) : 0;
  sunburst(c, GW / 2, GH * .44, t * .12, on); beams(c, t, on);
  globe(c, GW / 2, GH * .36, lerp(60, 190, eo(seg(t, .1, .9))), t * 1.4, clamp(on * 1.4));
  nameplate(c, t, .3, GH * .69);
  const v = seg(t, 1.1, 1.4); if (v > 0) { c.save(); c.globalAlpha = v; c.font = '500 26px Oswald'; c.letterSpacing = '9px'; c.textAlign = 'center'; c.fillStyle = '#b9b2a4'; c.fillText('KABAR EKONOMI · PEKAN INI', GW / 2 + 4, GH * .91); c.restore(); }
  if (flash > 0) { c.fillStyle = `rgba(255,255,250,${flash * .5})`; c.fillRect(0, 0, GW, GH); }
}

// ---------- newspapers (our own invented paper, never a real outlet) ----------
function makePaper(date, head, deck, body, headSize = 98) {
  const w = 1500, h = 1000, c = mk(w, h), g = c.getContext('2d');
  g.fillStyle = '#dcd6c8'; g.fillRect(0, 0, w, h); paperNoise(g, w, h, head.length * 3.1, .06);
  g.fillStyle = '#1d1b18'; g.textAlign = 'center'; g.font = '700 128px Oswald'; g.letterSpacing = '14px'; g.fillText('WARTA KILAT', w / 2, 150);
  g.fillRect(60, 178, w - 120, 5); g.fillRect(60, 232, w - 120, 2);
  g.font = '500 22px Oswald'; g.letterSpacing = '4px'; g.textAlign = 'left'; g.fillText(date, 66, 216); g.textAlign = 'right'; g.fillText('EDISI SORE', w - 66, 216);
  g.textAlign = 'center'; g.font = `700 ${headSize}px Oswald`; g.letterSpacing = '2px'; g.fillText(head, w / 2, 370);
  const full = g.measureText(head).width;
  g.font = 'italic 600 38px "Noto Sans"'; g.letterSpacing = '0px'; g.fillText(deck, w / 2, 438); g.fillRect(60, 470, w - 120, 2);
  g.font = '400 21px "Noto Sans"'; g.textAlign = 'left'; const cols = 4, cw = (w - 120 - (cols - 1) * 36) / cols;
  for (let k = 0; k < cols; k++) {
    let x = 60 + k * (cw + 36), y = 512, words = (body + ' ' + body).split(' ').slice(k * 9), line = '';
    for (const wd of words) { const tst = line ? line + ' ' + wd : wd; if (g.measureText(tst).width > cw) { g.fillText(line, x, y); y += 30; line = wd; if (y > h - 40) break; } else line = tst; }
    if (k) g.fillRect(x - 19, 490, 1.5, h - 520);
  }
  const v = g.createRadialGradient(w / 2, h / 2, h * .3, w / 2, h / 2, h); v.addColorStop(0, 'rgba(60,50,30,0)'); v.addColorStop(1, 'rgba(60,50,30,.22)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
  c.headX = [w / 2 - full / 2, w / 2 + full / 2]; g.font = `700 ${headSize}px Oswald`; g.letterSpacing = '2px'; c.ctx = g;
  return c;
}
const PAPER1 = makePaper('JAKARTA, RABU 5 AGUSTUS 2026', 'PENGANGGURAN TURUN KE 4,65 %', 'BPS: terendah sejak 1994, tapi 7,22 juta orang masih menganggur',
  'Badan Pusat Statistik mengumumkan tingkat pengangguran terbuka per Mei 2026 sebesar 4,65 persen, turun 0,03 poin dibanding Februari. Jumlah penganggur tercatat 7,22 juta orang. Kelompok umur 15 sampai 24 tahun tetap menjadi yang tertinggi, yakni 17,37 persen, naik dari 16,36 persen pada Februari. Pekerja informal mencapai 59,30 persen dari penduduk yang bekerja.');
{ const g = PAPER1.ctx, tail = g.measureText('4,65 %').width; PAPER1.hl = [PAPER1.headX[1] - tail, PAPER1.headX[1]]; }
const PAPER2 = makePaper('JAKARTA, SABTU 30 AGUSTUS 2025', 'PROTES TUNJANGAN DPR', 'Mahasiswa dan warga turun ke jalan, lahir "17+8 Tuntutan Rakyat"',
  'Kontroversi tunjangan anggota DPR memicu gelombang demonstrasi pada akhir Agustus 2025. Daftar 17+8 Tuntutan Rakyat beredar luas di media sosial: tujuh belas tuntutan jangka pendek dan delapan tuntutan jangka panjang. Pada 5 September 2025 pimpinan DPR mengumumkan penghentian tunjangan rumah anggota yang berlaku sejak 31 Agustus 2025 serta moratorium kunjungan kerja ke luar negeri.', 120);
function spinPaper(c, t, im, T0, TS, after) {
  bgDesk(c); const sFit = (GW - 70) / im.width;
  const drawAt = (s, rot, fx, fy, alpha, oy = 0) => { c.save(); c.globalAlpha = alpha; c.translate(GW / 2, GH / 2 + oy); c.rotate(rot); c.scale(s, s); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 40 / s; c.shadowOffsetY = 14 / s; c.drawImage(im, -fx * im.width, -fy * im.height); c.restore(); };
  if (t < TS) { for (let k = 3; k >= 0; k--) { const u = clamp((t - k * .018 - T0) / (TS - T0)); drawAt(sFit * (.06 + .94 * Math.pow(u, 2.3)), -Math.pow(1 - u, 1.25) * 2.5 * TAU, .5, .5, k ? .22 : 1); } return null; }
  const { s, fx, fy, oy } = after(sFit), k2 = Math.exp(-(t - TS) * 18) * .03;

  return { s: s * (1 + k2), fx, fy, oy: oy + jolt(t, TS), toG: (x, y) => [GW / 2 + (x - fx * im.width) * s * (1 + k2), GH / 2 + oy + jolt(t, TS) + (y - fy * im.height) * s * (1 + k2)] };
}
function scenePaper(c, t) {
  const r = spinPaper(c, t, PAPER1, HIT.paper_fly, HIT.paper_slam, sFit => {
    const p = ss(seg(t, HIT.paper_slam + .15, HIT.stop1)), z = lerp(1, 1.04, p) * (1 + .02 * seg(t, HIT.stop1, SEC.paper.t1));
    return { s: sFit * z, fx: .5, fy: lerp(.5, .40, p), oy: jolt(t, HIT.stop1, 10) };
  });
  if (!r) return;
  const [ax, ay] = r.toG(PAPER1.hl[0] - 6, 394), [bx] = r.toG(PAPER1.hl[1] + 6, 394);
  pencil(c, lineP(ax, ay, bx, ay - 6, 30), seg(t, HIT.ul_465, HIT.ul_465 + .3), 8);

// ---------- bulletin cards: values drawn to scale ----------
function barCard(c, t, T0, title, sub, bars, vmax, ticks, unit, ringT, ringI, src) {
  bgDesk(c);
  const z = lerp(1, 1.05, ss(seg(t, T0, T0 + 8)));
  c.save(); c.translate(GW / 2, GH / 2); c.scale(z, z); c.translate(-GW / 2, -GH / 2);
  const x0 = 170, y0 = 100, w = GW - 340, h = GH - 230;
  c.save(); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 40; c.shadowOffsetY = 14; c.fillStyle = '#dcd6c8'; c.fillRect(x0, y0, w, h); c.restore();
  c.save(); c.translate(x0, y0); paperNoise(c, w, h, title.length, .05);
  const ink = '#1d1b18'; c.fillStyle = ink; c.textAlign = 'center';
  c.font = '700 54px Oswald'; c.letterSpacing = '4px'; c.fillText(title, w / 2, 92); c.font = '500 26px Oswald'; c.letterSpacing = '5px'; c.fillText(sub, w / 2, 136); c.fillRect(70, 160, w - 140, 3);
  c.font = '400 19px "Noto Sans"'; c.letterSpacing = '0px'; c.textAlign = 'right'; c.fillText(src, w - 70, h - 22);
  const base = h - 150, top = 250, n = bars.length, bw = 210, gap = (w - n * bw) / (n + 1);
  c.strokeStyle = 'rgba(29,27,24,.35)'; c.lineWidth = 1.5; c.font = '500 22px Oswald'; c.letterSpacing = '2px'; c.textAlign = 'right';
  for (const v of ticks) { const y = base - (base - top) * v / vmax; c.beginPath(); c.moveTo(gap * .7, y); c.lineTo(w - gap * .5, y); c.stroke(); c.fillText(unit(v), gap * .62, y + 8); }
  const tops = [];
  bars.forEach(([a, b, v, lab], i) => {
    const g = eo(seg(t, T0 + .25 + i * BEAT * 2, T0 + .55 + i * BEAT * 2)), x = gap + i * (bw + gap), y = base - (base - top) * v / vmax * g;
    c.fillStyle = i === n - 1 ? '#1d1b18' : '#5d574e'; c.fillRect(x, y, bw, base - y);
    for (let k = 0; k < (base - y) / 9; k++) { c.fillStyle = 'rgba(220,214,200,.10)'; c.fillRect(x, y + k * 9, bw, 2); }
    c.fillStyle = ink; c.textAlign = 'center';
    if (g > .95) { c.font = '700 46px Oswald'; c.letterSpacing = '1px'; c.fillText(lab, x + bw / 2, y - 22); }
    c.font = '600 26px Oswald'; c.letterSpacing = '3px'; c.fillText(a, x + bw / 2, base + 44); c.font = '500 22px Oswald'; c.fillText(b, x + bw / 2, base + 78);
    tops.push([x0 + x + bw / 2, y0 + base - (base - top) * v / vmax - 40]);
  });
  c.restore();
  const [rx, ry] = tops[ringI]; pencil(c, ring(rx, ry + 10, 150, 64, .05), seg(t, ringT, ringT + .3), 8);
  c.restore();
}
const pct = v => String(v).replace('.', ',') + ' %';
